<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noimageindex">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#000000">
    <title>Page not found — Reed Cameron Osaki</title>
    <script>
      (() => {
        let preference = 'dark';
        try { preference = localStorage.getItem('reed-hub-theme') || 'dark'; } catch {}
        const query = new URLSearchParams(location.search);
        if (['dark', 'light', 'system'].includes(query.get('theme'))) preference = query.get('theme');
        if (!['dark', 'light', 'system'].includes(preference)) preference = 'dark';
        const root = document.documentElement;
        root.dataset.preference = preference;
        root.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        root.dataset.layout = query.get('layout') === 'gallery' ? 'gallery' : 'chapters';
        document.querySelector('meta[name="theme-color"]').content = root.dataset.theme === 'dark' ? '#000000' : '#f1f2ed';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/barlow-condensed-600.woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css?v=chapters-4">
    <script src="/main.js?v=chapters-4" defer></script>
